symbolPreset: unicode
composer:
  shape: claude
theme:
  dark: titanium
setupVersion: 2
hideThinkingBlock: true
dev:
  autoqaConsent: denied
advisor:
  enabled: true
defaultThinkingLevel: max
# modelRoles: niyet (intent) bazlı model eşlemesi; format `provider/model:thinkingLevel`
modelRoles:
  default: 9router/ocg/glm-5.3-flash:max  # Ana oturum, normal interaktif iş
  smol:    9router/ocg/deepseek-v4.1-flash:max # Hızlı/ucuz yardımcı işler; prewalk'in teslim hedefi
  tiny:    9router/ocg/deepseek-v4.1-flash:max # Mikro sınıflandırma, başlık üretimi, hafıza desteği (atanmazsa smol tercihi izler)
  vision:  9router/ocg/deepseek-v4.1-flash:max # Görüntü/ekran görüntüsü analizi
  commit:  9router/ocg/deepseek-v4.1-flash:max # Commit mesajı üretimi
  slow:    9router/ocg/mimo-v2.6-pro:high # Derin akıl yürütme, zor inceleme (gecikme kabul edilirse)
  plan:    9router/ocg/mimo-v2.6-pro:high # Plan modunda mimari/tasarım işi
  advisor: 9router/ocg/mimo-v2.6-pro:high # Advisor'ın bağımsız denetleyici ikinci modeli (inherited etmez, ayrı güçlü model arar)
  task:    9router/ocg/mimo-v2.6-pro:high # Alt ajan (subagent) işçi kodlayıcı